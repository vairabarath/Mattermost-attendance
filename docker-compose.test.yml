# Throwaway Postgres for integration tests (scripts/test-integration.sh).
# Separate project name, no volume (tmpfs), not on Mattermost's network.
name: attendance-test
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30
