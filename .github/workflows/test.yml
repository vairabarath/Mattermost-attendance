name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (unit + integration, race detector)
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: plugin/.nvmrc
          cache: npm
          cache-dependency-path: plugin/webapp/package-lock.json
      - name: build (manifest, server, webapp, bundle)
        run: make dist
      - name: server tests
        run: cd server && go vet ./... && go test -race -count=1 ./...
      - name: webapp types, lint and tests
        run: cd webapp && npx tsc --noEmit && npm run lint && npm run test-ci
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-plugin
          path: plugin/dist/*.tar.gz
          retention-days: 30
